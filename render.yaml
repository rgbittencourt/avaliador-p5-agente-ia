services:
  - type: web
    name: avaliador-agente-ia
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: APP_USERNAME
        value: professor
      - key: APP_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_DATA_OWNER
        value: rgbittencourt
      - key: GITHUB_DATA_REPO
        value: avaliador-p5-agente-ia-dados
      - key: GITHUB_DATA_BRANCH
        value: main
      - key: GITHUB_DATA_PATH
        value: dados/turmas.json
      - key: GITHUB_DATA_TOKEN
        sync: false

